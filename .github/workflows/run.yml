```yaml
name: Oracle A1 Capacity Grabber

on:
  workflow_dispatch:
  schedule:
    # GitHub attempts this every 5 minutes.
    # Scheduled workflows can sometimes be delayed by GitHub.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  grab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install oci-cli
          oci --version

      - name: Try to grab A1 capacity
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}

          OCI_REGION: ap-singapore-1
          OCI_AD: "uNAn:AP-SINGAPORE-1-AD-1"

        run: |
          chmod +x launch.sh
          ./launch.sh
```
